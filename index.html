<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dra. Tayna Decot — Cirurgiã-dentista</title>
  <meta name="description" content="Dra. Tayna Decot, cirurgiã-dentista. Odontologia estética com cuidado, técnica e leveza. Agende sua consulta.">
  <meta name="theme-color" content="#f5efe9">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">

    <!-- Topo: nome + foto -->
    <header class="hero">
      <span class="hero__mono" aria-hidden="true">td</span>
      <svg class="hero__flourish" viewBox="0 0 300 60" aria-hidden="true"><path d="M2 48c40-6 70-30 120-30s60 26 100 20 60-28 76-30"/></svg>

      <!-- Foto da Dra.: assets/img/tayna.jpg (vertical, fundo claro) -->
      <div class="hero__photo">
        <img src="assets/img/tayna.jpg" alt="Dra. Tayna Decot" onerror="this.parentElement.classList.add('is-empty'); this.remove()">
        <span class="hero__photo-empty" aria-hidden="true">Foto da Dra.<br><small>assets/img/tayna.jpg</small></span>
      </div>

      <div class="hero__text">
        <h1 class="hero__name"><span>Tayna</span><span>Decot</span></h1>
        <p class="hero__role">Cirurgiã-dentista</p>
        <p class="hero__tagline">Sorrisos naturais com <strong>técnica</strong>, <strong>cuidado</strong> e leveza.</p>
      </div>
    </header>

    <div class="ornament" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M8 1l3 7-3 7-3-7z"/><circle cx="8" cy="8" r="1"/></svg></div>

    <!-- Botões -->
    <nav class="links" aria-label="Menu principal">
      <a class="link link--feature" href="agendar.html" style="--bg: url('assets/img/btn-agendar.jpg')">
        <span class="link__label">Agende sua<br>consulta</span>
        <svg class="link__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </a>

      <a class="link" href="tratamentos.html" style="--bg: url('assets/img/btn-tratamentos.jpg')">
        <span class="link__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 5.5c-2-2-7-2.6-8 1.6-.9 3.6 1 6 1.8 9.3.7 3 .9 5.1 2.4 5.1s1.4-4.4 3.8-4.4 2.3 4.4 3.8 4.4 1.7-2.1 2.4-5.1c.8-3.3 2.7-5.7 1.8-9.3-1-4.2-6-3.6-8-1.6z"/></svg>
        </span>
        <span class="link__label">Tratamentos</span>
        <svg class="link__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </a>

      <a class="link" href="sobre.html" style="--bg: url('assets/img/btn-sobre.jpg')">
        <span class="link__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.2-3.8 4.2-5.5 7.5-5.5s6.3 1.7 7.5 5.5"/></svg>
        </span>
        <span class="link__label">Sobre<br>mim</span>
        <svg class="link__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </a>

      <a class="link" href="contato.html" style="--bg: url('assets/img/btn-contato.jpg')">
        <span class="link__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 0 1-12.4 7.5L3.5 20.5l1-4.4A8.5 8.5 0 1 1 20.5 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg>
        </span>
        <span class="link__label">Fale<br>comigo</span>
        <svg class="link__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </a>
    </nav>

    <footer class="foot">
      <div class="foot__social">
        <a href="https://instagram.com/" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.2 6.8h.01"/></svg>
        </a>
        <a href="https://wa.me/5500000000000" target="_blank" rel="noopener" aria-label="WhatsApp">
          <svg viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 0 1-12.4 7.5L3.5 20.5l1-4.4A8.5 8.5 0 1 1 20.5 12z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8c-1-.5-1.8-1.3-2.3-2.3l.8-1-1-2z"/></svg>
        </a>
      </div>
      <p class="foot__sign">Tayna Decot</p>
      <p class="foot__copy">CRO-XX 00000 · © <span id="year"></span></p>
    </footer>
  </main>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
